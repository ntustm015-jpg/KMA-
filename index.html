<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>後設認知知識監控評量（KMA） </title>

<style>

body{
    font-family:"Microsoft JhengHei",sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f4f6f9;
}

.card{
    background:white;
    padding:20px;
    margin:20px 0;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h1,h2{
    text-align:center;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#005ea6;
}

.hidden{
    display:none;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

.correct{
    color:green;
    font-weight:bold;
}

.wrong{
    color:red;
    font-weight:bold;
}

.score{
    font-size:1.5rem;
    font-weight:bold;
    color:#0078d4;
}

</style>

</head>

<body>

<div id="page1">

<div class="card">

<h1>🧠 後設認知知識監控評量（KMA）</h1>

<p>
第一階段：預測
 <br>   
請先閱讀題目，評估自己是否能答對。
</p>

</div>

<div id="predictionArea"></div>

<button onclick="startQuiz()">
第二階段：正式作答（選擇題）
</button>

</div>

<div id="page2" class="hidden">

<div class="card">
<h2>正式測驗</h2>
</div>

<div id="quizArea"></div>

<button onclick="submitQuiz()">
提交答案
</button>

</div>

<div id="page3" class="hidden">

<div class="card">

<h2>Knowledge Monitoring Result</h2>

<div id="summary"></div>

</div>

<div id="detail"></div>

<br>

<button onclick="location.reload()">
重新測驗
</button>

</div>

<script>

const questions=[

{
question:"何者最符合後設認知的概念？",
options:[
"背誦課本內容",
"記錄老師講義",
"監控與評估自己的學習狀況",
"完成作業"
],
answer:2
},

{
question:"如果學生知道自己哪裡會、哪裡不會，代表其具有較好的什麼能力？",
options:[
"記憶能力",
"後設認知能力",
"智商",
"注意力"
],
answer:1
},

{
question:"哪一項較屬於 Monitoring（監控）？",
options:[
"抄筆記",
"背定義",
"確認自己是否真正理解內容",
"瀏覽投影片"
],
answer:2
},

{
question:"為何網路學習特別需要後設認知？",
options:[
"教材比較簡單",
"老師會隨時提醒",
"學生需自行規劃與調整學習",
"考試比較少"
],
answer:2
},

{
question:"高後設認知學習者最可能出現哪種學習表現？",
options:[
"重複閱讀熟悉內容",
"只關心成績",
"能區分已知與未知內容",
"完全依賴教師"
],
answer:2
}

];

const predictionArea=document.getElementById("predictionArea");
const quizArea=document.getElementById("quizArea");

for(let i=0;i<questions.length;i++){

predictionArea.innerHTML+=`

<div class="card">

<h3>Q${i+1}</h3>

<p>${questions[i].question}</p>

<label>
<input type="radio"
name="predict${i}"
value="yes">
我有把握答對
</label>

<br><br>

<label>
<input type="radio"
name="predict${i}"
value="no">
我沒有把握答對
</label>

</div>

`;

}

for(let i=0;i<questions.length;i++){

let html=`

<div class="card">

<h3>Q${i+1}</h3>

<p>${questions[i].question}</p>

`;

for(let j=0;j<questions[i].options.length;j++){

html+=`

<label>

<input
type="radio"
name="answer${i}"
value="${j}">

${questions[i].options[j]}

</label>

<br><br>

`;

}

html+="</div>";

quizArea.innerHTML+=html;

}



function startQuiz(){

for(let i=0;i<questions.length;i++){

const check=document.querySelector(
'input[name="predict'+i+'"]:checked'
);

if(!check){

alert("請完成所有信心評估");

return;

}

}

document.getElementById("page1")
.classList.add("hidden");

document.getElementById("page2")
.classList.remove("hidden");

}



function submitQuiz(){

let correct=0;

let A=0;
let B=0;
let C=0;
let D=0;

let rows="";

for(let i=0;i<questions.length;i++){

const predict=
document.querySelector(
'input[name="predict'+i+'"]:checked'
);

const answer=
document.querySelector(
'input[name="answer'+i+'"]:checked'
);

if(!answer){

alert("請完成所有題目");

return;

}

const prediction=predict.value;

const actual=
Number(answer.value)===
questions[i].answer;

if(actual){

correct++;

}

if(prediction==="yes" && actual){

A++;

}

if(prediction==="yes" && !actual){

B++;

}

if(prediction==="no" && actual){

C++;

}

if(prediction==="no" && !actual){

D++;

}

rows+=`

<tr>

<td>Q${i+1}</td>

<td>
${prediction==="yes"?"有把握":"沒把握"}
</td>

<td class="${actual?"correct":"wrong"}">

${actual?"答對":"答錯"}

</td>

</tr>

`;

}


const N=A+B+C+D;

const hamann=((A+D)-(B+C))/N;

let level="";
let explanation="";

if(hamann>=0.8){

level="🎯 優秀";

explanation=
"你非常清楚自己知道什麼與不知道什麼。";

}
else if(hamann>=0.4){

level="👍 良好";

explanation=
"你具有不錯的知識監控能力。";

}
else if(hamann>=0){

level="🤔 普通";

explanation=
"你的知識監控能力中等，仍存在部分誤判。";

}
else{

level="⚠️ 需加強";

explanation=
"你經常高估或低估自己的知識狀態。";

}


document.getElementById("summary").innerHTML=`

<h3>${level}</h3>

<p class="score">

Hamann Coefficient

<br>

${hamann.toFixed(2)}

</p>

<p>${explanation}</p>

<hr>

<p>答對題數：${correct}/5</p>

<p>A（預測會且答對）：${A}</p>

<p>B（預測會但答錯）：${B}</p>

<p>C（預測不會但答對）：${C}</p>

<p>D（預測不會且答錯）：${D}</p>

`;

document.getElementById("detail").innerHTML=`

<table>

<tr>

<th>題目</th>
<th>信心判斷</th>
<th>實際結果</th>

</tr>

${rows}

</table>

`;

document.getElementById("page2")
.classList.add("hidden");

document.getElementById("page3")
.classList.remove("hidden");

}

</script>

</body>
</html>
